<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <meta
        name="theme-color"
        content="#ffffff"
    >

    <meta
        name="description"
        content="نبض اليمن - آخر الأخبار اليمنية والعربية"
    >

    <title>نبض اليمن</title>

    <!-- ملف تصميم التطبيق -->
    <link
        rel="stylesheet"
        href="./style.css"
    >

    <!-- إعدادات تطبيق PWA -->
    <link
        rel="manifest"
        href="./manifest.json"
    >
</head>


<body>

    <!-- =====================================================
         رأس التطبيق
         ===================================================== -->

    <header class="app-header">

        <div class="brand">

            <div class="flag">
                🇾🇪
            </div>

            <div class="brand-text">

                <h1>
                    نبض اليمن
                </h1>

                <p>
                    آخر الأخبار اليمنية والعربية
                </p>

            </div>

        </div>

    </header>


    <!-- =====================================================
         شريط التحكم
         ===================================================== -->

    <main class="app-container">

        <section class="controls">

            <!-- تحديث الأخبار -->

            <button
                id="refreshButton"
                class="control-button refresh-button"
                type="button"
            >
                <span>🇾🇪</span>
                <span>تحديث الأخبار</span>
            </button>


            <!-- ترتيب حسب الأحدث -->

            <button
                id="sortNewestButton"
                class="control-button active"
                type="button"
            >
                الأحدث
            </button>


            <!-- ترتيب حسب الأكثر قراءة -->

            <button
                id="sortPopularButton"
                class="control-button"
                type="button"
            >
                الأكثر قراءة
            </button>

        </section>


        <!-- =================================================
             حالة تحميل الأخبار
             ================================================= -->

        <section
            id="statusBox"
            class="status-box"
            hidden
        >
            جاري تحميل الأخبار...
        </section>


        <!-- =================================================
             قائمة الأخبار
             ================================================= -->

        <section
            id="newsList"
            class="news-list"
            aria-live="polite"
        >
        </section>


        <!-- =================================================
             رسالة عدم وجود أخبار
             ================================================= -->

        <section
            id="emptyState"
            class="empty-state"
            hidden
        >
            لا توجد أخبار متاحة حالياً.
        </section>

    </main>


    <!-- =====================================================
         تذييل التطبيق
         ===================================================== -->

    <footer class="app-footer">

        <p>
            نبض اليمن 🇾🇪
        </p>

    </footer>


    <!-- ملف JavaScript الرئيسي -->

    <script type="module" src="./app.js"></script>


    <!-- =====================================================
         تسجيل Service Worker
         ===================================================== -->

    <script>

        if ("serviceWorker" in navigator) {

            window.addEventListener(
                "load",
                () => {

                    navigator.serviceWorker
                        .register("./service-worker.js")
                        .then(
                            () => {
                                console.log(
                                    "Service Worker registered"
                                );
                            }
                        )
                        .catch(
                            error => {
                                console.error(
                                    "Service Worker error:",
                                    error
                                );
                            }
                        );

                }
            );

        }

    </script>

</body>

</html>
