<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <meta
        name="theme-color"
        content="#ffffff"
    >

    <meta
        name="description"
        content="آخر أخبار اليمن من مصادر مختلفة"
    >

    <title>نبض اليوم</title>

    <!-- ملف تصميم التطبيق -->
    <link
        rel="stylesheet"
        href="./style.css"
    >

    <!-- إعدادات تطبيق PWA -->
    <link
        rel="manifest"
        href="./manifest.json"
    >
</head>


<body>

    <!-- =====================================================
         رأس التطبيق
         ===================================================== -->

    <header class="app-header">

        <div class="brand">

            <div class="flag">
                🇾🇪
            </div>

            <div class="brand-text">

                <h1>
                    نبض اليوم
                </h1>

                <p>
                    آخر أخبار اليمن من مصادر مختلفة
                </p>

            </div>

        </div>

    </header>


    <!-- =====================================================
         المحتوى الرئيسي
         ===================================================== -->

    <main class="app-container">


        <!-- =================================================
             أزرار التحكم
             ================================================= -->

        <section class="controls">

            <button
                id="refreshButton"
                class="control-button refresh-button"
                type="button"
            >
                <span>🇾🇪</span>
                <span>تحديث الأخبار</span>
            </button>


            <button
                id="sortNewestButton"
                class="control-button active"
                type="button"
            >
                الأحدث
            </button>


            <button
                id="sortPopularButton"
                class="control-button"
                type="button"
            >
                الأكثر قراءة
            </button>

        </section>


        <!-- =================================================
             إحصائيات التطبيق
             ================================================= -->

        <section class="stats-bar">

            <div class="stat-item">

                <span class="stat-icon">
                    👥
                </span>

                <span class="stat-label">
                    الزوار
                </span>

                <strong id="visitsCount">
                    0
                </strong>

            </div>


            <div class="stat-item">

                <span class="stat-icon">
                    👁️
                </span>

                <span class="stat-label">
                    المشاهدات
                </span>

                <strong id="viewsCount">
                    0
                </strong>

            </div>


            <div class="stat-item">

                <span class="stat-icon">
                    📖
                </span>

                <span class="stat-label">
                    القراءات
                </span>

                <strong id="readsCount">
                    0
                </strong>

            </div>

        </section>


        <!-- =================================================
             حالة تحميل الأخبار
             ================================================= -->

        <section
            id="statusBox"
            class="status-box"
            hidden
        >
            جاري تحميل الأخبار...
        </section>


        <!-- =================================================
             قائمة الأخبار
             ================================================= -->

        <section
            id="newsList"
            class="news-list"
            aria-live="polite"
        >
        </section>


        <!-- =================================================
             رسالة عدم وجود أخبار
             ================================================= -->

        <section
            id="emptyState"
            class="empty-state"
            hidden
        >
            لا توجد أخبار متاحة حالياً.
        </section>

    </main>


    <!-- =====================================================
         تذييل التطبيق
         ===================================================== -->

    <footer class="app-footer">

        <p>
            نبض اليوم 🇾🇪
        </p>

    </footer>


    <!-- =====================================================
         ملف JavaScript الرئيسي
         ===================================================== -->

    <script
        type="module"
        src="./app.js"
    ></script>


    <!-- =====================================================
         تسجيل Service Worker
         ===================================================== -->

    <script>

        if ("serviceWorker" in navigator) {

            window.addEventListener(
                "load",
                () => {

                    navigator.serviceWorker
                        .register("./service-worker.js")
                        .then(
                            () => {

                                console.log(
                                    "Service Worker registered"
                                );

                            }
                        )
                        .catch(
                            error => {

                                console.error(
                                    "Service Worker error:",
                                    error
                                );

                            }
                        );

                }
            );

        }

    </script>

</body>

</html>
