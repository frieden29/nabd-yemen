name: Yemen News Bot

on:
  workflow_dispatch:

  schedule:
    - cron: "0,15,30,45 * * * *"

permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-latest

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Yemen news bot
        run: |
          python yemen_news_bot.py

      - name: Save updated news
        run: |
          git config user.name "Yemen News Bot"
          git config user.email "actions@github.com"

          git add news.json

          if git diff --cached --quiet; then
            echo "No news changes."
          else
            git commit -m "Update Yemen news"
            git push
          fi
